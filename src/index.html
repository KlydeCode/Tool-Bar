<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Island</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Conteneur glissé hors de l'écran quand l'auto-masquage est actif -->
  <div class="bar">
  <button class="pill" id="pill" aria-label="Ouvrir la barre" aria-expanded="false">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="pill-title" id="pill-title"></span>
    <span class="pill-time" id="pill-time">23:20</span>
  </button>

  <main class="panel" id="panel">
    <canvas class="backdrop" id="backdrop" width="180" height="175" aria-hidden="true"></canvas>
    <div class="top">
      <section class="card music" aria-label="Musique">
        <div class="card-head">
          <span class="label">En cours</span>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="track">
          <div class="cover" id="cover" aria-hidden="true">
            <img class="cover-art" id="cover-art" alt="">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div class="track-text">
            <div class="title" id="track-title">Aucune musique</div>
            <div class="artist" id="track-artist">Rien en cours de lecture</div>
          </div>
          <div class="controls">
            <button class="ctrl prev" id="prev" aria-label="Précédent">
              <svg class="icon" viewBox="0 0 24 24"><polygon points="17 20 7 12 17 4 17 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
            </button>
            <button class="play" id="play" aria-label="Lecture">
              <svg class="icon icon-pause" viewBox="0 0 24 24"><rect x="14" y="5" width="3" height="14" rx="1"/><rect x="7" y="5" width="3" height="14" rx="1"/></svg>
              <svg class="icon icon-play" viewBox="0 0 24 24"><polygon points="7 4 19 12 7 20 7 4"/></svg>
            </button>
            <button class="ctrl next" id="next" aria-label="Suivant">
              <svg class="icon" viewBox="0 0 24 24"><polygon points="7 4 17 12 7 20 7 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
            </button>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="times"><span id="time-pos">0:00</span><span id="time-total">0:00</span></div>
      </section>

      <section class="card clock" id="clock" aria-label="Heure — cliquer pour ouvrir l'agenda" title="Ouvrir l'agenda">
        <div class="card-head">
          <span class="label" id="date">MER. 14 OCT.</span>
          <button class="collapse" id="collapse" aria-label="Réduire la barre">
            <svg class="icon" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
          </button>
        </div>
        <div class="time" id="time">23<span class="colon">:</span>20</div>
      </section>
    </div>

    <!-- Recherche d'applis du PC -->
    <label class="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="search" placeholder="Rechercher une appli…" autocomplete="off" spellcheck="false" aria-label="Rechercher une appli">
    </label>

    <div class="section-head">
      <span class="label" id="tiles-label">Raccourcis</span>
      <span class="label" id="tile-count">06</span>
    </div>

    <!-- Tuiles (remplies par app.js depuis la config ; glisser-déposer pour les déplacer) -->
    <nav class="tiles" id="tiles" aria-label="Raccourcis"></nav>
    <!-- Résultats de la recherche, à la place des tuiles -->
    <div class="tiles results" id="results" aria-label="Applis trouvées"></div>

    <section class="card volume" aria-label="Volume">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>
      <span class="label">Volume</span>
      <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      <span class="volume-value" id="volume-value">65</span>
      <button class="mic" id="mic" aria-label="Couper le micro">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </button>
    </section>
    <!-- Réglages : remplacent le contenu du panneau (tuile 06) -->
    <section class="settings" id="settings" aria-label="Réglages">
      <div class="settings-head">
        <span class="label">Réglages</span>
        <button class="back" id="settings-back" aria-label="Retour">
          <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          <span>Retour</span>
        </button>
      </div>
      <div class="settings-body">
        <div class="card settings-group">
          <div class="set-row"><span>Thème</span><div class="themes" id="set-themes"></div></div>
          <label class="set-row"><span>Fond</span><input type="color" id="set-bg"></label>
          <label class="set-row"><span>Cartes</span><input type="color" id="set-surface"></label>
          <label class="set-row"><span>Couleur 1</span><input type="color" id="set-c1"></label>
          <label class="set-row"><span>Couleur 2</span><input type="color" id="set-c2"></label>
          <label class="set-row"><span>Transparence</span>
            <input type="range" id="set-transparency" min="0" max="70" step="1">
            <span class="set-value" id="set-transparency-value">30 %</span></label>
          <label class="set-row"><span>Police</span><select class="field" id="set-font"></select></label>
          <label class="set-row"><span>Masquage automatique</span><input type="checkbox" class="switch" id="set-autohide"></label>
          <label class="set-row" id="startup-row"><span>Lancer au démarrage de Windows</span><input type="checkbox" class="switch" id="set-startup"></label>
          <div class="set-row"><span>Raccourci clavier</span><button class="field key" id="set-shortcut"></button></div>
        </div>
        <div class="card settings-group">
          <span class="label">Tuiles</span>
          <div class="set-tiles" id="set-tiles"></div>
        </div>
        <p class="settings-status" id="settings-status" role="status"></p>
        <div class="settings-actions">
          <button class="field" id="settings-reset">Réglages par défaut</button>
          <button class="field danger" id="settings-quit">Quitter la barre</button>
        </div>
      </div>
    </section>
  </main>
  <!-- Agenda : se déplie à droite du panneau (clic sur l'horloge) -->
  <aside class="agenda" id="agenda" aria-label="Agenda">
    <canvas class="backdrop" id="agenda-backdrop" width="350" height="175" aria-hidden="true"></canvas>
    <div class="agenda-head">
      <div>
        <div class="label" id="week-label">Semaine</div>
        <div class="week-range" id="week-range"></div>
      </div>
      <div class="agenda-nav">
        <button class="icon-btn" id="week-prev" aria-label="Semaine précédente">
          <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="field today" id="week-today">Aujourd'hui</button>
        <button class="icon-btn" id="week-next" aria-label="Semaine suivante">
          <svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <button class="icon-btn" id="agenda-manage" aria-label="Gérer les agendas" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
    </div>
    <div class="week" id="week"></div>
    <div class="agenda-sources" id="agenda-sources">
      <div class="label">Agendas</div>
      <div class="source-list" id="source-list"></div>
      <form class="source-add" id="source-add">
        <input class="field" type="url" id="source-url" placeholder="Lien iCal (https:// ou webcal://)" aria-label="Lien iCal">
        <button class="field" type="submit">Ajouter</button>
      </form>
      <button class="field" id="source-import">Importer un fichier .ics</button>
      <p class="settings-status" id="agenda-status" role="status"></p>
    </div>
  </aside>
  </div>
  <script src="../lib/media.js"></script>
  <script src="../lib/themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
