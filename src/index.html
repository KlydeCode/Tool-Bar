<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'">
  <title>Ma Barre</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Panneau déplié (phase 2 : toujours visible). Clic droit : quitter (provisoire). -->
  <main class="panel" id="panel">
    <div class="top">
      <section class="card music is-playing" id="music" aria-label="Musique">
        <div class="card-head">
          <span class="label">En cours</span>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="track">
          <div class="cover" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div class="track-text">
            <div class="title">Titre du morceau</div>
            <div class="artist">Artiste</div>
          </div>
          <div class="controls">
            <button class="ctrl prev" aria-label="Précédent">
              <svg class="icon" viewBox="0 0 24 24"><polygon points="17 20 7 12 17 4 17 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
            </button>
            <button class="play" id="play" aria-label="Pause">
              <svg class="icon icon-pause" viewBox="0 0 24 24"><rect x="14" y="5" width="3" height="14" rx="1"/><rect x="7" y="5" width="3" height="14" rx="1"/></svg>
              <svg class="icon icon-play" viewBox="0 0 24 24"><polygon points="7 4 19 12 7 20 7 4"/></svg>
            </button>
            <button class="ctrl next" aria-label="Suivant">
              <svg class="icon" viewBox="0 0 24 24"><polygon points="7 4 17 12 7 20 7 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
            </button>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><div class="progress-fill"></div></div>
        <div class="times"><span>1:42</span><span>3:28</span></div>
      </section>

      <section class="card clock" aria-label="Heure">
        <div class="card-head">
          <span class="label" id="date">MER. 14 OCT.</span>
          <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
        </div>
        <div class="time" id="time">23<span class="colon">:</span>20</div>
      </section>
    </div>

    <div class="section-head">
      <span class="label">Raccourcis</span>
      <span class="label">06</span>
    </div>

    <nav class="tiles" aria-label="Raccourcis">
      <button class="tile"><span class="num">01</span>
        <svg class="icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span class="name">VS Code</span></button>
      <button class="tile"><span class="num">02</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
        <span class="name">Téléchargements</span></button>
      <button class="tile"><span class="num">03</span>
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        <span class="name">Navigateur</span></button>
      <button class="tile"><span class="num">04</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span class="name">Claude</span></button>
      <button class="tile"><span class="num">05</span>
        <svg class="icon" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
        <span class="name">Terminal</span></button>
      <button class="tile"><span class="num">06</span>
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>
        <span class="name">Réglages</span></button>
    </nav>

    <section class="card volume" aria-label="Volume">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>
      <span class="label">Volume</span>
      <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume">
      <span class="volume-value" id="volume-value">65</span>
      <button class="mic" id="mic" aria-label="Couper le micro">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
